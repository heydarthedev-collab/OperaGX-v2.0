name: AnyDesk

on:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: pwsh

jobs:
  rdp:
    runs-on: windows-latest
    timeout-minutes: 360

    env:
      ANYDESK_PASS: Pass@1234
      RUNTIME_MINUTES: 360

    steps:
      - name: Wipe Unnecessary Pre-Installed GitHub Apps & Shortcuts
        run: |
          Write-Host "Purging unnecessary desktop icons and shortcuts..."

          $publicDesktop = [Environment]::GetFolderPath("CommonDesktopDirectory")
          $userDesktop = "$env:USERPROFILE\Desktop"

          $targets = @(
            "Unity Hub.lnk",
            "R 4.6.0.lnk",
            "Firefox.lnk",
            "Google Chrome.lnk",
            "Opera GX.lnk",
            "Claim Rewards Here.lnk"
          )

          foreach ($target in $targets) {
            $publicPath = Join-Path $publicDesktop $target
            $userPath = Join-Path $userDesktop $target

            if (Test-Path $publicPath) {
              Remove-Item $publicPath -Force -ErrorAction SilentlyContinue
            }

            if (Test-Path $userPath) {
              Remove-Item $userPath -Force -ErrorAction SilentlyContinue
            }
          }

      - name: Download and Install AnyDesk
        run: |
          $url = "https://download.anydesk.com/AnyDesk.exe"
          $dst = "$env:TEMP\AnyDesk.exe"

          Write-Host "Downloading AnyDesk..."
          Invoke-WebRequest -Uri $url -OutFile $dst -UseBasicParsing

          $installDir = "C:\Program Files (x86)\AnyDesk"

          if (-not (Test-Path $installDir)) {
            New-Item -ItemType Directory -Path $installDir -Force | Out-Null
          }

          Write-Host "Installing AnyDesk..."

          $process = Start-Process `
            -FilePath $dst `
            -ArgumentList @(
              "--install `"$installDir`"",
              "--silent",
              "--start-with-win"
            ) `
            -Wait `
            -PassThru

          if ($process.ExitCode -ne 0) {
            Write-Error "AnyDesk installer exited with code $($process.ExitCode)"
            exit 1
          }

          Remove-Item $dst -Force -ErrorAction SilentlyContinue

      - name: Configure AnyDesk Unattended Access
        run: |
          $ad = "C:\Program Files (x86)\AnyDesk\AnyDesk.exe"

          if (-not (Test-Path $ad)) {
            $ad = "C:\Program Files\AnyDesk\AnyDesk.exe"
          }

          if (-not (Test-Path $ad)) {
            Write-Error "AnyDesk.exe was not found."
            exit 1
          }

          Write-Host "Configuring AnyDesk password..."

          $password = $env:ANYDESK_PASS

          $psi = New-Object System.Diagnostics.ProcessStartInfo
          $psi.FileName = $ad
          $psi.Arguments = "--set-password"
          $psi.UseShellExecute = $false
          $psi.RedirectStandardInput = $true
          $psi.RedirectStandardOutput = $true
          $psi.RedirectStandardError = $true
          $psi.CreateNoWindow = $true

          $proc = New-Object System.Diagnostics.Process
          $proc.StartInfo = $psi

          [void]$proc.Start()
          $proc.StandardInput.WriteLine($password)
          $proc.StandardInput.Close()

          $stdout = $proc.StandardOutput.ReadToEnd()
          $stderr = $proc.StandardError.ReadToEnd()

          $proc.WaitForExit()

          if ($stderr) {
            Write-Host "AnyDesk output: $stderr"
          }

          if ($proc.ExitCode -ne 0) {
            Write-Error "Failed to configure AnyDesk password."
            exit 1
          }

          Write-Host "Restarting AnyDesk service..."

          Start-Process `
            -FilePath $ad `
            -ArgumentList "--restart-service" `
            -Wait `
            -NoNewWindow

      - name: Minimize Running Infrastructure Windows
        run: |
          Write-Host "Minimizing active desktop windows..."

          $shell = New-Object -ComObject Shell.Application
          $shell.MinimizeAll()

      # ==========================================================
      # MOBILE DISPLAY CONFIGURATION
      # ==========================================================

      - name: Configure Fixed Mobile-Friendly Display
        run: |
          Write-Host "Configuring fixed mobile-friendly display..."

          $width = 1280
          $height = 720

          if (Get-Command Set-DisplayResolution -ErrorAction SilentlyContinue) {

            Write-Host "Setting resolution to ${width}x${height}..."

            Set-DisplayResolution `
              -Width $width `
              -Height $height `
              -Force `
              -ErrorAction SilentlyContinue

          }
          else {
            Write-Host "Set-DisplayResolution is unavailable on this runner."
          }

          Write-Host "Configuring display scaling..."

          $desktopPath = "HKCU:\Control Panel\Desktop"

          if (Test-Path $desktopPath) {

            Set-ItemProperty `
              -Path $desktopPath `
              -Name "LogPixels" `
              -Type DWord `
              -Value 96 `
              -ErrorAction SilentlyContinue

            Set-ItemProperty `
              -Path $desktopPath `
              -Name "Win8DpiScaling" `
              -Type DWord `
              -Value 1 `
              -ErrorAction SilentlyContinue
          }

          $explorerPath =
            "HKCU:\Software\Microsoft\Windows\CurrentVersion\Explorer\Advanced"

          if (Test-Path $explorerPath) {

            Set-ItemProperty `
              -Path $explorerPath `
              -Name "TaskbarGlomLevel" `
              -Type DWord `
              -Value 0 `
              -ErrorAction SilentlyContinue
          }

          Write-Host "Mobile display configuration completed."
          Write-Host "Target resolution: ${width}x${height}"
          Write-Host "Target aspect ratio: 16:9"

      # ==========================================================
      # GOOGLE CHROME
      # ==========================================================

      - name: Install Google Chrome
        run: |
          Write-Host "Checking for Google Chrome..."

          $chromePaths = @(
            "$env:ProgramFiles\Google\Chrome\Application\chrome.exe",
            "$env:ProgramFiles (x86)\Google\Chrome\Application\chrome.exe"
          )

          $chromeExe = $chromePaths |
            Where-Object { Test-Path $_ } |
            Select-Object -First 1

          if (-not $chromeExe) {

            Write-Host "Chrome not found. Downloading official Chrome Enterprise MSI..."

            $chromeMsi = "$env:TEMP\ChromeSetup.msi"

            $chromeUrl =
              "https://dl.google.com/dl/chrome/install/googlechromestandaloneenterprise64.msi"

            Invoke-WebRequest `
              -Uri $chromeUrl `
              -OutFile $chromeMsi `
              -UseBasicParsing

            Write-Host "Installing Google Chrome..."

            $install = Start-Process `
              -FilePath "msiexec.exe" `
              -ArgumentList @(
                "/i",
                "`"$chromeMsi`"",
                "/qn",
                "/norestart"
              ) `
              -Wait `
              -PassThru

            if ($install.ExitCode -ne 0) {
              Write-Error "Chrome installation failed with exit code $($install.ExitCode)"
              exit 1
            }

            Remove-Item `
              $chromeMsi `
              -Force `
              -ErrorAction SilentlyContinue
          }

          $chromePaths = @(
            "$env:ProgramFiles\Google\Chrome\Application\chrome.exe",
            "$env:ProgramFiles (x86)\Google\Chrome\Application\chrome.exe"
          )

          $chromeExe = $chromePaths |
            Where-Object { Test-Path $_ } |
            Select-Object -First 1

          if (-not $chromeExe) {
            Write-Error "Google Chrome executable was not found."
            exit 1
          }

          Write-Host "Chrome path: $chromeExe"

      - name: Create Chrome Desktop Shortcut
        run: |
          $chromePaths = @(
            "$env:ProgramFiles\Google\Chrome\Application\chrome.exe",
            "$env:ProgramFiles (x86)\Google\Chrome\Application\chrome.exe"
          )

          $chromeExe = $chromePaths |
            Where-Object { Test-Path $_ } |
            Select-Object -First 1

          if (-not $chromeExe) {
            Write-Error "Chrome executable not found."
            exit 1
          }

          $publicDesktop =
            [Environment]::GetFolderPath("CommonDesktopDirectory")

          $shortcutPath =
            Join-Path $publicDesktop "Google Chrome Browser.lnk"

          $targetUrl =
            "https://chromewebstore.google.com/detail/urban-vpn-proxy/eppiocemhmnlbhjplcgkofciiegomcon"

          $WshShell = New-Object -ComObject WScript.Shell

          $Shortcut =
            $WshShell.CreateShortcut($shortcutPath)

          $Shortcut.TargetPath = $chromeExe
          $Shortcut.Arguments =
            "--no-first-run `"$targetUrl`""

          $Shortcut.WorkingDirectory =
            Split-Path $chromeExe

          $Shortcut.Description =
            "Google Chrome"

          $Shortcut.Save()

          Write-Host "Chrome desktop shortcut created."

      - name: Launch Chrome
        run: |
          $chromePaths = @(
            "$env:ProgramFiles\Google\Chrome\Application\chrome.exe",
            "$env:ProgramFiles (x86)\Google\Chrome\Application\chrome.exe"
          )

          $chromeExe = $chromePaths |
            Where-Object { Test-Path $_ } |
            Select-Object -First 1

          if (-not $chromeExe) {
            Write-Error "Chrome executable not found."
            exit 1
          }

          $targetUrl =
            "https://chromewebstore.google.com/detail/urban-vpn-proxy/eppiocemhmnlbhjplcgkofciiegomcon"

          Write-Host "Launching Google Chrome..."

          Start-Process `
            -FilePath $chromeExe `
            -ArgumentList @(
              "--no-first-run",
              "--start-maximized",
              $targetUrl
            )

          Start-Sleep -Seconds 8

      # ==========================================================
      # FINAL DISPLAY CHECK
      # ==========================================================

      - name: Final Display Check
        run: |
          Write-Host "=============================================="
          Write-Host "        MOBILE DISPLAY CONFIGURATION"
          Write-Host "=============================================="
          Write-Host " Resolution : 1280x720"
          Write-Host " Aspect     : 16:9"
          Write-Host " Scaling    : 100%"
          Write-Host " Mode       : Fixed"
          Write-Host " Chrome     : Installed"
          Write-Host " Roblox     : Not Installed"
          Write-Host "=============================================="

      # ==========================================================
      # ANYDESK CONNECTION INFORMATION
      # ==========================================================

      - name: Fetch and Display AnyDesk Connection Address
        run: |
          $adPaths = @(
            "C:\Program Files (x86)\AnyDesk\AnyDesk.exe",
            "C:\Program Files\AnyDesk\AnyDesk.exe"
          )

          $ad = $adPaths |
            Where-Object { Test-Path $_ } |
            Select-Object -First 1

          if (-not $ad) {
            Write-Error "AnyDesk.exe was not found."
            exit 1
          }

          Write-Host "AnyDesk executable:"
          Write-Host $ad

          $cleanId = ""

          # ------------------------------------------------------
          # Method 1: system.conf
          # ------------------------------------------------------

          $configPaths = @(
            "C:\ProgramData\AnyDesk\system.conf",
            "$env:APPDATA\AnyDesk\system.conf"
          )

          foreach ($confPath in $configPaths) {

            if (-not (Test-Path $confPath)) {
              continue
            }

            Write-Host "Checking configuration:"
            Write-Host $confPath

            try {
              $content = Get-Content `
                -Path $confPath `
                -Raw `
                -ErrorAction Stop

              if ($content -match 'ad\.anynet\.id\s*=\s*(\d+)') {
                $cleanId = $Matches[1]
                break
              }

              if ($content -match '(?:anynet|id)[^0-9]{0,20}(\d{6,})') {
                $cleanId = $Matches[1]
                break
              }
            }
            catch {
              Write-Host "Could not read configuration file."
            }
          }

          # ------------------------------------------------------
          # Method 2: AnyDesk CLI
          # ------------------------------------------------------

          if ([string]::IsNullOrWhiteSpace($cleanId)) {

            Write-Host "Trying AnyDesk CLI..."

            try {

              $outputFile = "$env:TEMP\anydesk-id.txt"

              & $ad --get-id 2>&1 |
                Out-File `
                  -FilePath $outputFile `
                  -Encoding utf8

              if (Test-Path $outputFile) {

                $cliOutput =
                  Get-Content `
                    -Path $outputFile `
                    -Raw

                Write-Host "AnyDesk CLI output:"
                Write-Host $cliOutput

                if ($cliOutput -match '\b(\d{6,})\b') {
                  $cleanId = $Matches[1]
                }
              }

              Remove-Item `
                $outputFile `
                -Force `
                -ErrorAction SilentlyContinue
            }
            catch {
              Write-Host "AnyDesk CLI ID retrieval failed."
            }
          }

          # ------------------------------------------------------
          # Retry
          # ------------------------------------------------------

          if ([string]::IsNullOrWhiteSpace($cleanId)) {

            Write-Host "ID not available yet. Waiting for AnyDesk..."

            for ($i = 1; $i -le 10; $i++) {

              Start-Sleep -Seconds 3

              try {

                $output = & $ad --get-id 2>&1

                if ($output) {

                  $text = ($output | Out-String)

                  if ($text -match '\b(\d{6,})\b') {
                    $cleanId = $Matches[1]
                    break
                  }
                }
              }
              catch {
                Write-Host "Retry $i failed."
              }
            }
          }

          # ------------------------------------------------------
          # Final output
          # ------------------------------------------------------

          if ([string]::IsNullOrWhiteSpace($cleanId)) {

            Write-Host ""
            Write-Host "===================================================="
            Write-Host "        ANYDESK ID COULD NOT BE DETECTED"
            Write-Host "===================================================="
            Write-Host "AnyDesk is installed, but the ID was not returned."
            Write-Host "===================================================="

            exit 1
          }

          Write-Host ""
          Write-Host "===================================================="
          Write-Host "        ANYDESK WINDOWS MACHINE IS READY"
          Write-Host "===================================================="
          Write-Host ""
          Write-Host " CONNECTION ID : $cleanId"
          Write-Host " PASSWORD      : $env:ANYDESK_PASS"
          Write-Host ""
          Write-Host " DISPLAY       : 1280x720 / 16:9"
          Write-Host " CHROME        : INSTALLED"
          Write-Host " ROBLOX STUDIO : NOT INSTALLED"
          Write-Host " RUNTIME       : 360 MINUTES"
          Write-Host ""
          Write-Host "===================================================="

      # ==========================================================
      # KEEP ALIVE
      # ==========================================================

      - name: Keep alive
        run: |
          $mins = [int]$env:RUNTIME_MINUTES
          $end = (Get-Date).AddMinutes($mins)

          while ((Get-Date) -lt $end) {

            $now = Get-Date

            Write-Host (
              "Cloud PC Heartbeat " +
              $now.ToString("HH:mm:ss") +
              " | Active until " +
              $end.ToString("HH:mm:ss")
            )

            Start-Sleep -Seconds 60
          }
